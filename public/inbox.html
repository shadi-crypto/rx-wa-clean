<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inbox — RX WA</title>
<link rel="stylesheet" href="/inbox.css">
</head>
<body>
<header>
  <div class="brand">💬 RX WA — <span id="cname"></span></div>
  <div class="hdr-right">
    <span class="bell" id="bell"></span>
    <a href="/logout">خروج</a>
  </div>
</header>
<div class="wrap">
  <aside class="list" id="list">
    <div class="empty">لا محادثات بعد</div>
  </aside>
  <main class="chat">
    <div class="msgs" id="msgs">
      <div class="placeholder">اختر محادثة من اليمين ←</div>
    </div>
    <div class="box">
      <input id="txt" placeholder="اكتب رداً..." onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">إرسال</button>
    </div>
  </main>
</div>
<div id="toast"></div>
<script src="/inbox.js"></script>
</body>
</html>
