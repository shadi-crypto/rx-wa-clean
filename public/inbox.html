<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RX WA — صندوق الوارد</title>
<link rel="stylesheet" href="/inbox.css">
</head>
<body>
<div id="app">
  <!-- Sidebar: conversation list (Chatwoot-style) -->
  <aside id="sidebar">
    <header id="sb-head">
      <div class="brand">💬 RX WA</div>
      <div class="sb-meta" id="clientName">—</div>
    </header>
    <div id="searchWrap">
      <input id="search" placeholder="🔍 بحث في المحادثات…">
    </div>
    <ul id="convList"></ul>
  </aside>

  <!-- Main: messages + composer -->
  <main id="main">
    <header id="conv-head">
      <div id="convTitle">اختر محادثة</div>
      <div id="convSub"></div>
    </header>
    <div id="messages"></div>
    <footer id="composer">
      <textarea id="msgInput" placeholder="اكتب رداً… (Enter لإرسال)"></textarea>
      <button id="sendBtn">إرسال ↩</button>
    </footer>
  </main>
</div>

<div id="toast"></div>
<script src="/inbox.js"></script>
</body>
</html>
